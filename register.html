<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Registration</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

  <div class="bg-white rounded-lg shadow-lg w-full max-w-xl overflow-hidden">

  <img src="banner.png"
       alt="Blood Donation"
       class="w-full h-[160px] p-3  object-cover">

  <div class="px-8 py-4">
    <h2 class="text-3xl font-bold text-center text-red-600 mb-6">
      Jivadhara Registration
    </h2>


    <form id="registerForm" novalidate class="space-y-4">

      <!-- Student ID -->
      <div class="form-group">
        <label class="block font-medium">Student ID</label>
        <input id="studentId" class="w-full border p-2 rounded">
        <small class="error text-red-500 text-sm"></small>
      </div>

      <!-- Name -->
      <div class="form-group">
        <label class="block font-medium">Full Name</label>
        <input id="name" class="w-full border p-2 rounded">
        <small class="error text-red-500 text-sm"></small>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label class="block font-medium">Email Address</label>
        <input id="email" class="w-full border p-2 rounded">
        <small class="error text-red-500 text-sm"></small>
      </div>

      <!-- Age -->
      <div class="form-group">
        <label class="block font-medium">Age</label>
        <input id="age" type="number" class="w-full border p-2 rounded">
        <small class="error text-red-500 text-sm"></small>
      </div>

      <!-- Gender -->
      <div class="form-group">
        <label class="block font-medium">Gender</label>
        <select id="gender" class="w-full border p-2 rounded">
          <option value="">Select Gender</option>
          <option>Male</option>
          <option>Female</option>
        </select>
        <small class="error text-red-500 text-sm"></small>
      </div>

      <!-- Phone -->
      <div class="form-group">
        <label class="block font-medium">Phone Number</label>
        <div class="flex gap-2">
          <select id="countryCode" class="border p-2 rounded w-28">
            <option value="">Code</option>
            <option value="+91">🇮🇳 +91</option>
            <option value="+1">🇺🇸 +1</option>
            <option value="+44">🇬🇧 +44</option>
          </select>
          <input id="phone" class="flex-1 border p-2 rounded" placeholder="10-digit number">
        </div>
        <small class="error text-red-500 text-sm"></small>
      </div>

      <!-- Course -->
      <div class="form-group">
        <label class="block font-medium">Course</label>
        <select id="course" onchange="updateBranches()" class="w-full border p-2 rounded">
          <option value="">Select Course</option>
          <option>B.Tech</option>
          <option>M.Tech</option>
          <option>Diploma</option>
        </select>
        <small class="error text-red-500 text-sm"></small>
      </div>

      <!-- Branch -->
      <div class="form-group">
        <label class="block font-medium">Branch</label>
        <select id="branch" class="w-full border p-2 rounded">
          <option value="">Select Branch</option>
        </select>
        <small class="error text-red-500 text-sm"></small>
      </div>

      <!-- Blood Group -->
      <div class="form-group">
        <label class="block font-medium">Blood Group</label>
        <select id="blood" class="w-full border p-2 rounded">
          <option value="">Select Blood Group</option>
          <option>A+</option><option>A-</option>
          <option>B+</option><option>B-</option>
          <option>O+</option><option>O-</option>
          <option>AB+</option><option>AB-</option>
        </select>
        <small class="error text-red-500 text-sm"></small>
      </div>

      <!-- Donation Date -->
      <div class="form-group">
        <label class="block font-medium">Last Blood Donation Date</label>
        <input id="lastDonation" type="date" class="w-full border p-2 rounded">
        <small class="error text-red-500 text-sm"></small>
      </div>

      <!-- Submit -->
      <button id="submitBtn"
  disabled
  class="w-full bg-gray-400 text-white py-2 rounded cursor-not-allowed">
  Register
</button>


    </form>
  </div>

  <div id="toast"
  class="fixed bottom-6 right-6 bg-green-600 text-white px-6 py-3 rounded shadow-lg hidden">
  ✅ Registration Successful
</div>


  <script src="validation.js"></script>
</body>
</html>
